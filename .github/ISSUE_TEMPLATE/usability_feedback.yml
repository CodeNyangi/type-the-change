name: Usability feedback / 사용 경험
description: Tell us where the flow helped or got in your way. / 막히거나 도움이 된 순간을 알려 주세요.
title: "[UX] "
body:
  - type: markdown
    attributes:
      value: |
        Korean and English are welcome. 한국어로 편하게 작성해 주세요.
        You do not need to diagnose a bug or propose a design. Please remove private code and personal details from any examples or images.
  - type: textarea
    id: task
    attributes:
      label: What were you doing? / 무엇을 하려고 했나요?
      description: A short description of your task is enough.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What stood out? / 어떤 순간이 기억에 남나요?
      description: For example, something unclear, an unnecessary step, a hard-to-find action, or a part that helped you understand the change.
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: What would have helped? / 무엇이 도움이 되었을까요?
      description: Optional. Describe what you expected, or attach a redacted screenshot.
  - type: input
    id: environment
    attributes:
      label: Environment / 사용 환경
      description: Optional. Extension version, operating system, panel size or theme, keyboard or accessibility setup.

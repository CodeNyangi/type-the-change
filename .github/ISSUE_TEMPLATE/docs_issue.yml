# Adapted from openai/codex at
# 67f0994b532b8740f14b5b738af7b7b2a915b1d6: 6-docs-issue.yml.
name: Documentation issue / 문서 문제
description: Report missing, incorrect, or unclear documentation. / 빠졌거나 잘못되었거나 이해하기 어려운 문서를 알려 주세요.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        English and Korean are welcome. 한국어로 편하게 작성해 주세요.
        Tell us what needs clarification. Please remove private code and account details from examples.
        보완할 부분을 알려 주세요. 예제에는 비공개 코드나 계정 정보를 넣지 마세요.
  - type: dropdown
    id: kind
    attributes:
      label: What needs attention? / 어떤 문제인가요?
      multiple: true
      options:
        - Missing information / 빠진 설명
        - Incorrect guidance / 잘못된 설명
        - Unclear instructions / 이해하기 어려운 안내
        - Example does not run / 실행되지 않는 예제
        - Something else / 기타
  - type: textarea
    id: issue
    attributes:
      label: Describe the problem / 문제를 설명해 주세요
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Where is the documentation? / 어느 문서인가요?
      description: Include a URL, file path, or section name if available. / URL, 파일 경로, 항목 이름이 있으면 알려 주세요.
